<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depuis le début de la COP, les jets privés convergent à Antalya | Vert</title>
<meta name="robots" content="noindex">
<!-- Globe interactif — jets privés arrivés à Antalya pendant la COP31.
     Habillage : celui des cartes de Vert (data centers, galaxie TotalEnergies ; moteur
     01_Projets/2026-11_carte-interactive-modele, visionneuse.css, classes .habillage / .hab-*).
     Globe : adapté du gabarit 03_Charte/gabarits-cartes-interactives/united-globe.
     NE PAS ÉDITER 04_exports/…/index.html : modifier ce gabarit puis relancer 06_scripts/03_injecte_globe.py -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vend+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--police:"Vend Sans","Helvetica Neue",Arial,sans-serif;color-scheme:light;}
*{box-sizing:border-box;}
html,body{margin:0;background:#fff;color:#000;font:14px/1.4 var(--police);}

/* ---- Habillage (repris de visionneuse.css / galaxie.css) : cadre blanc bordé, titre, légende, carte, source + logo ---- */
.habillage{--fond:#ffffff;--texte:#1c2426;--doux:#5d6b6e;--bord:#dfe5e6;--vert:#004352;--survol:#fdf0e9;
  width:100%;max-width:700px;margin:0 auto;display:flex;flex-direction:column;
  background:#fff;color:#000;border:1px solid var(--bord);border-radius:6px;padding:14px 16px 10px;}
/* titre = intertitre (h3) des articles de vert.eco : Vend Sans 700, 22 à 24 px, interlettrage -0,01 em, interligne 1,2 */
.hab-titre{margin:0 0 8px;font:700 clamp(22px, 1.375rem + ((1vw - 3.2px) * 0.179), 24px)/1.2 var(--police);
  letter-spacing:-0.01em;color:#000;text-wrap:balance;}
/* légende : deux colonnes égales (flux / couleurs) ; titres de colonne sur mobile seulement, comme le moteur */
.habillage .legende{margin:0 0 8px;font-size:13px;line-height:1.3;color:#000;}
.habillage .leg-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin:0;}
.habillage .leg-col{display:flex;flex-direction:column;gap:2px;min-width:0;}
.leg-groupe{display:none;font-weight:600;padding:0 2px 1px;}
.leg-ligne{display:flex;align-items:center;gap:6px;padding:2px 2px;}
.leg-ligne svg{display:block;flex:none;}
/* légende = filtre (comme les data centers) : un flux se masque / s'affiche d'un clic ou d'un toucher */
.leg-filtre .leg-ligne{width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;
  padding:2px 2px;cursor:pointer;border-radius:3px;-webkit-tap-highlight-color:transparent;}
.leg-filtre .leg-ligne:hover{background:var(--survol);}
.leg-filtre .leg-ligne:focus-visible{outline:2px solid var(--vert);outline-offset:1px;}
.leg-filtre .leg-ligne[aria-pressed="false"]{opacity:.38;}
.leg-astuce{display:block;color:var(--doux);font-size:11px;margin-top:2px;}

/* ---- Globe : couches empilées ---- */
/* cadre du globe rendu visible : filet gris de l'habillage, coins de 3 px comme .habillage .cadre */
.vt-scene{position:relative;width:100%;aspect-ratio:1/1;border:1px solid var(--bord);border-radius:3px;overflow:hidden;background:#fff;}
.vt-scene canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
.vt-scene canvas.vt-grab{cursor:grabbing;}
.vt-scene .vt-plat{display:block;width:100%;height:auto;}
@supports not (aspect-ratio:1/1){
  .vt-scene{height:0;padding-bottom:100%;}
  .vt-scene canvas{position:absolute;top:0;left:0;}
}
.vt-contour{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
/* globe WebGL positionné : il passe au-dessus du calque d'ombre (inséré avant lui) et sous le contour */
.vt-scene canvas.vt-gl{position:relative;}
.vt-lyr{position:absolute;inset:0;pointer-events:none;overflow:hidden;--fs:12px;}
.vt-lab{position:absolute;white-space:nowrap;font-size:var(--fs);line-height:1;font-weight:500;color:#000;
  transform:translateY(-50%);opacity:0;transition:opacity .25s;
  text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 4px #fff,0 0 4px #fff;}
.vt-lab.vt-on{opacity:1;}
.vt-lab.vt-hub{font-weight:700;color:var(--vert);font-size:calc(var(--fs) + 1.5px);}
.vt-lab.vt-r{transform:translate(-100%,-50%);}

/* ---- Infobulle (celle du moteur : .tooltip, .tt-ligne) ---- */
.vt-tip{position:absolute;z-index:5;pointer-events:none;background:var(--fond);color:var(--texte);
  border:1px solid var(--bord);padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.4;
  width:max-content;max-width:min(260px, calc(100% - 8px));box-shadow:0 6px 18px rgba(0,0,0,.18);
  transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .08s;}
.vt-tip.vt-on{opacity:1;}
.vt-tip.vt-bas{transform:translate(-50%,16px);}
/* écran étroit : infobulle en bandeau au bas du globe (comme le bandeau des data centers), fermée en touchant à côté */
.vt-tip.vt-bandeau{left:8px !important;right:8px;top:auto !important;bottom:8px;width:auto;max-width:none;transform:none;
  font-size:13px;padding:9px 12px;}
.vt-tip.vt-bandeau b{font-size:14px;}
.vt-tip.vt-bandeau .tt-ligne{font-size:12.5px;}
.vt-tip b{display:block;font-weight:600;font-size:13px;color:var(--vert);}
.vt-tip small{display:block;margin-top:4px;color:var(--doux);font-size:11px;}
.tt-ligne{font-size:11.5px;margin-top:3px;}
.tt-ligne span{color:var(--doux);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-right:2px;}

/* ---- Boutons de vue (comme les boutons de zoom du moteur) ---- */
.vt-views{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 0;}
.vt-views button{height:32px;padding:0 12px;border:1px solid var(--bord);background:var(--fond);color:var(--vert);
  border-radius:6px;font:500 13px var(--police);cursor:pointer;}
.vt-views button:hover{background:var(--survol);}
.vt-views button[aria-pressed="true"]{background:var(--vert);border-color:var(--vert);color:#fff;}

/* ---- Pied : source en Light + logo ; méthodologie repliée ---- */
.hab-pied{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:8px;}
.hab-textes{min-width:0;}
.hab-source{font-size:12px;font-weight:300;line-height:1.35;color:#000;}
.hab-source a{color:inherit;}
.hab-logo{flex:none;display:block;width:72px;height:auto;}

.vt-liste{margin:8px 0 0;padding-left:0;font-size:12.5px;line-height:1.45;list-style:none;}
.vt-liste li{margin-bottom:3px;}
.vt-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;}

@media (max-width:760px){
  .habillage{padding:10px 10px 8px;}
  .habillage .leg-cols{gap:0 10px;}
  .leg-groupe{display:block;}
  .hab-logo{width:60px;}
  .hab-pied{flex-direction:column;align-items:stretch;gap:6px;}
  .hab-logo{align-self:flex-end;}
  /* cibles tactiles : 32 px minimum pour les lignes de légende (les deux colonnes, pour rester alignées),
     36 px pour les boutons de vue */
  .leg-col .leg-ligne{min-height:32px;}
  .vt-views button{height:36px;}
}
</style>
</head>

  });

  canvas.addEventListener('pointermove', function (e) {
    var rect = canvas.getBoundingClientRect();
    last.x = e.clientX - rect.left; last.y = e.clientY - rect.top;
    var p = pointers[e.pointerId];
    if (!p) { pick(); return; }
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    idleSince = performance.now();
    if (nPointers >= 2) {
      var span = pinchSpan();
      if (pinch > 0 && span > 0) { dist = Math.max(DIST_MIN, Math.min(DIST_MAX, dist * (pinch / span))); dirty = true; }
      pinch = span;
      return;
    }
    var k = (2.0 / Math.max(1, H)) * (dist / DIST_START);
    var rx = dy * k, ry = dx * k;
    rotate(rx, ry);
    vel.x = vel.x * 0.4 + rx * 0.6;
    vel.y = vel.y * 0.4 + ry * 0.6;
    setHover(-1);
  });

  function release(e) {
    if (pointers[e.pointerId]) { delete pointers[e.pointerId]; nPointers--; }
    if (nPointers < 2) pinch = 0;
    if (nPointers === 0) canvas.classList.remove('vt-grab');
    idleSince = performance.now();
    if (moved < 6) pick();
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') setHover(-1); });

  function pinchSpan() {
    var ids = Object.keys(pointers);
    if (ids.length < 2) return 0;
    var a = pointers[ids[0]], b = pointers[ids[1]];
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  canvas.addEventListener('wheel', function (e) {
    if (!WHEEL_ZOOM && !e.ctrlKey) return;
    e.preventDefault();
    dist = Math.max(DIST_MIN, Math.min(DIST_MAX, dist * Math.exp(e.deltaY * 0.0015)));
    idleSince = performance.now(); spinRamp = 0; stopSpin(); tween = null;
    dirty = true;
  }, { passive:false });

  // ligne la plus proche du curseur, à 14 px près. Toutes convergent vers Antalya :
  // on ignore le dernier dixième de chaque arc, sinon le survol d'Antalya serait arbitraire.
  function pick() {
    var best = -1, bestD = 14 * 14, i, j, pts, pr, n;
    for (i = 0; i < lignes.length; i++) {
      if (!visibles[catDe(lignes[i].r)]) continue;
      pts = lignes[i].pts; n = pts.length;
      for (j = 0; j < n * 0.9; j += 2) {
        pr = project(pts[j]);
        if (pr && pr.vis) {
          var dx = pr.x - last.x, dy = pr.y - last.y, d2 = dx*dx + dy*dy;
          if (d2 < bestD) { bestD = d2; best = i; }
        }
      }
    }
    setHover(best);
  }

  function setHover(i) {
    if (i === hover) return;
    hover = i;
    dirty = true;
    if (i < 0) { tip.classList.remove('vt-on'); return; }
    var r = lignes[i].r, o = r.o, v = r.vol;
    tip.innerHTML = '<b>' + o.t + '</b>' +
      '<div class="tt-ligne"><span>Avion</span> ' + v.m + '</div>' +
      '<div class="tt-ligne"><span>Arrivée</span> ' + dateTxt(v.h) + '</div>' +
      '<div class="tt-ligne"><span>CO2e estimé</span> ' + (v.co2 === null ? 'non estimé' : fr(v.co2) + '&nbsp;t') + '</div>' +
      (o.v > 1 ? '<small>Un des ' + o.v + ' jets partis de cet aéroport</small>' : '');
    tip.classList.add('vt-on');
    tipH = tip.offsetHeight || 60;
  }

  root.querySelector('.legende').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-k]');
    if (!b) return;
    var k = b.getAttribute('data-k');
    visibles[k] = !visibles[k];
    b.setAttribute('aria-pressed', visibles[k] ? 'true' : 'false');
    if (hover >= 0 && !visibles[catDe(lignes[hover].r)]) setHover(-1);
    dirty = true;
  });

  VUES.forEach(function (v, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = v.t;
    b.setAttribute('aria-pressed', i === VUE_DEFAUT ? 'true' : 'false');
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(bar.children, function (c, j) {
        c.setAttribute('aria-pressed', j === i ? 'true' : 'false');
      });
      stopSpin(); setHover(-1);
      tween = { q0:q, q1:quatFromView(v.lon, v.lat), d0:dist, d1:v.d, t:0 };
      dirty = true;
    });
    bar.appendChild(b);
  });

  /* ================================================================== */
  /* 10. Étiquettes                                                     */
  /* ================================================================== */

  // Nommés d'office : Antalya et les départs d'au moins 2 jets (en colonne étroite :
  // au moins 5). Les autres apparaissent quand on touche leur ligne.
  var labels = Object.keys(AP).map(function (code) {
    var a = AP[code];
    var el = document.createElement('div');
    el.textContent = a.n;
    layer.appendChild(el);
    var kind = a.hub ? 'vt-hub' : (a.tur ? 'vt-tur' : 'vt-int');
    el.className = 'vt-lab ' + kind;
    return { el: el, a: a, code: code, kind: kind, p: scale(toVec(a.lon, a.lat), 1.006),
             pri: a.hub ? 1e6 : a.v };
  }).sort(function (x, y) { return y.pri - x.pri; });

  function placeLabels(alpha) {
    var vus = [], boxes = [], i, seuil = etroit ? 5 : 2;
    for (i = 0; i < labels.length; i++) {
      var L = labels[i];
      L.enJeu = hover >= 0 && (L.code === lignes[hover].r.a || L.code === ARR.code);
      // de loin, les aéroports turcs sont collés à Antalya : leurs noms glisseraient
      // sur le mauvais point. On ne les nomme que dans les vues rapprochées.
      var montre = L.a.hub || L.enJeu || (L.a.v >= seuil && !(L.a.tur && dist > 3.0));
      if (!L.a.hub && !visibles[L.a.tur ? 'tur' : 'int']) montre = false;   // flux masqué : son nom aussi
      var pr = (alpha > 0.15 && montre) ? project(L.p) : null;
      if (!pr || !pr.vis) { hide(L); continue; }
      L.pr = pr;
      L.w = L.a.n.length * fs * (L.a.hub ? 0.66 : 0.6) + 8;
      vus.push(L);
    }
    vus.sort(function (a, b) { return (b.enJeu - a.enJeu) || (b.pri - a.pri) || (a.pr.y - b.pr.y); });

    var dy = fs + 1.5, dx = fs * 0.7, hb = fs + 1;
    for (i = 0; i < vus.length; i++) {
      var M = vus[i], p = M.pr, ok = false, k, j, t, bx, by;
      var tries = [[p.x + dx, p.y, 0], [p.x - dx, p.y, 1],
                   [p.x + dx, p.y - dy, 0], [p.x + dx, p.y + dy, 0],
                   [p.x - dx, p.y - dy, 1], [p.x - dx, p.y + dy, 1],
                   [p.x + dx, p.y - 2 * dy, 0], [p.x + dx, p.y + 2 * dy, 0]];
      for (k = 0; k < tries.length && !ok; k++) {
        t = tries[k];
        bx = t[2] ? t[0] - M.w : t[0];
        by = t[1] - hb / 2;
        if (bx < 0 || bx + M.w > W || by < 0 || by + hb > H) continue;
        ok = true;
        for (j = 0; j < boxes.length; j++) {
          if (bx < boxes[j][0] + boxes[j][2] && bx + M.w > boxes[j][0] &&
              by < boxes[j][1] + boxes[j][3] && by + hb > boxes[j][1]) { ok = false; break; }
        }
        if (!ok) continue;
        boxes.push([bx, by, M.w, hb]);
        M.el.className = 'vt-lab ' + M.kind + ' vt-on' + (t[2] ? ' vt-r' : '');
        M.el.style.left = t[0] + 'px';
        M.el.style.top  = t[1] + 'px';
        M.el.style.opacity = (hover >= 0 && !M.enJeu) ? alpha * 0.3 : alpha;
      }
      if (!ok) hide(M);
    }
  }
  function hide(L) { L.el.className = 'vt-lab ' + L.kind; L.el.style.opacity = 0; }

  /* ================================================================== */
  /* 11. Dimensionnement                                                */
  /* ================================================================== */

  function resize() {
    var r = { width: host.clientWidth, height: host.clientHeight };   // sans le filet du cadre
    if (!r.width || !r.height) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    W = r.width; H = r.height;
    if (w === canvas.width && h === canvas.height) return;
    canvas.width = w; canvas.height = h;
    contour.width = w; contour.height = h;
    ombre.width = w; ombre.height = h;
    gl.viewport(0, 0, w, h);
    etroit = W < LARGEUR_ETROITE;
    fs = etroit ? 9.5 : (W < 560 ? 11 : 12);
    layer.style.setProperty('--fs', fs + 'px');
    dirty = true;
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(host);
  else window.addEventListener('resize', resize);
  resize();

  /* ================================================================== */
  /* 12. Boucle de rendu                                                */
  /* ================================================================== */

  var visible = true, running = false, lastT = 0, raf = 0;
  if (window.IntersectionObserver) {
    new IntersectionObserver(function (entries) { visible = entries[0].isIntersecting; toggle(); },
      { rootMargin:'100px' }).observe(host);
  }
  document.addEventListener('visibilitychange', function () { toggle(); });

  function toggle() {
    var go = visible && !document.hidden;
    if (go && !running) { running = true; lastT = 0; raf = requestAnimationFrame(frame); }
    else if (!go && running) { running = false; cancelAnimationFrame(raf); }
  }

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function frame(t) {
    raf = requestAnimationFrame(frame);
    var dt = lastT ? Math.min(64, t - lastT) : 16.7;
    lastT = t;
    if (revealT < REVEAL_FIN + 1000) { revealT += dt; dirty = true; }
    if (tween) {
      tween.t = Math.min(1, tween.t + dt / 900);
      var e = easeOut(tween.t);
      q = quatSlerp(tween.q0, tween.q1, e);
      dist = tween.d0 + (tween.d1 - tween.d0) * e;
      dirty = true;
      if (tween.t >= 1) tween = null;
    } else if (nPointers === 0) {
      if (Math.abs(vel.x) > 1e-5 || Math.abs(vel.y) > 1e-5) {
        var f = dt / 16.7;
        rotate(vel.x * f, vel.y * f);
        var damp = Math.pow(0.93, f);
        vel.x *= damp; vel.y *= damp;
        if (Math.abs(vel.x) < 1e-5) vel.x = 0;
        if (Math.abs(vel.y) < 1e-5) vel.y = 0;
        idleSince = t;
      } else if (spin && t - idleSince > IDLE_RESUME_MS) {
        spinRamp = Math.min(1, spinRamp + dt / 1200);
        spinSelf(spinRamp * SPIN_RATE * dt / 1000);
      }
    }
    if (!dirty) return;
    dirty = false;
    draw();
  }

  function draw() {
    var aspect = W / H || 1;
    dEff = dist / Math.min(1, aspect);
    perspective(30 * Math.PI / 180, aspect, 0.1, 100, proj);
    modelView(q, dEff, mv);
    mat4Mul(proj, mv, mvp);

    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.disable(gl.BLEND);
    gl.depthMask(true);
    gl.useProgram(pGlobe);
    gl.uniformMatrix4fv(gA.mvp, false, mvp);
    gl.bindBuffer(gl.ARRAY_BUFFER, bGPos);
    gl.enableVertexAttribArray(gA.pos); gl.vertexAttribPointer(gA.pos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, bGUV);
    gl.enableVertexAttribArray(gA.uv);  gl.vertexAttribPointer(gA.uv, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bGIdx);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
    gl.disableVertexAttribArray(gA.pos); gl.disableVertexAttribArray(gA.uv);

    gl.enable(gl.BLEND);
    gl.depthMask(false);
    gl.useProgram(pArc);
    gl.uniformMatrix4fv(aA.mvp, false, mvp);
    gl.uniform2f(aA.vp, canvas.width, canvas.height);
    gl.enableVertexAttribArray(aA.pos); gl.enableVertexAttribArray(aA.dir);
    gl.enableVertexAttribArray(aA.side); gl.enableVertexAttribArray(aA.t);

    var i, L, p, dim;
    for (i = 0; i < lignes.length; i++) {
      L = lignes[i];
      p = Math.max(0, Math.min(1, (revealT - L.delay) / 1500));
      L.prog = easeOut(p);
      if (L.prog <= 0 || !visibles[catDe(L.r)]) continue;
      dim = (hover >= 0 && hover !== i) ? 0.2 : 1;
      gl.bindBuffer(gl.ARRAY_BUFFER, L.buf);
      gl.vertexAttribPointer(aA.pos,  3, gl.FLOAT, false, 32, 0);
      gl.vertexAttribPointer(aA.dir,  3, gl.FLOAT, false, 32, 12);
      gl.vertexAttribPointer(aA.side, 1, gl.FLOAT, false, 32, 24);
      gl.vertexAttribPointer(aA.t,    1, gl.FLOAT, false, 32, 28);
      gl.uniform1f(aA.hw, (L.width + (hover === i ? 0.7 : 0)) * dpr * 1.35);
      gl.uniform3fv(aA.color, L.color);
      gl.uniform1f(aA.prog, L.prog);
      gl.uniform1f(aA.alpha, dim);   // opaque : la couleur à l'écran est celle de la légende
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, L.count);
    }
    gl.disableVertexAttribArray(aA.pos); gl.disableVertexAttribArray(aA.dir);
    gl.disableVertexAttribArray(aA.side); gl.disableVertexAttribArray(aA.t);

    gl.useProgram(pDot);
    gl.uniformMatrix4fv(dA.mvp, false, mvp);
    gl.enableVertexAttribArray(dA.pos);
    var appear = Math.max(0, Math.min(1, (revealT - 300) / 700));
    for (i = 0; i < lignes.length; i++) {
      L = lignes[i];
      if (L.prog <= 0 || !L.premier || !visibles[catDe(L.r)]) continue;
      gl.bindBuffer(gl.ARRAY_BUFFER, L.dot);
      gl.vertexAttribPointer(dA.pos, 3, gl.FLOAT, false, 0, 0);
      gl.uniform1f(dA.size, 6.5 * dpr);
      gl.uniform3fv(dA.color, C_HUB);
      gl.uniform1f(dA.alpha, (hover >= 0 && lignes[hover].r.a !== L.r.a) ? 0.35 : 1);
      gl.drawArrays(gl.POINTS, 0, 1);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, bHub);
    gl.vertexAttribPointer(dA.pos, 3, gl.FLOAT, false, 0, 0);
    gl.uniform1f(dA.size, 13 * dpr);
    gl.uniform3fv(dA.color, C_HUB);
    gl.uniform1f(dA.alpha, appear);
    gl.drawArrays(gl.POINTS, 0, 1);
    gl.disableVertexAttribArray(dA.pos);

    gl.depthMask(true);
    gl.disable(gl.BLEND);

    dessineContour();
    placeLabels(Math.max(0, Math.min(1, (revealT - 900) / 800)));

    if (hover >= 0 && etroit) {
      tip.className = 'vt-tip vt-on vt-bandeau';
    } else if (hover >= 0) {
      var bas = last.y - tipH - 14 < 0;
      tip.className = 'vt-tip vt-on' + (bas ? ' vt-bas' : '');
      var marge = Math.min(124, W / 2);   // demi-largeur de l'infobulle (240 px)
      tip.style.left = Math.max(marge, Math.min(W - marge, last.x)) + 'px';
      var y = last.y + (bas ? 14 : -6);
      if (bas) y = Math.min(y, H - tipH - 4);
      tip.style.top = y + 'px';
    }
  }

  // rayon apparent de la sphère (rayon 1, caméra à dEff, champ vertical de 30°)
  function dessineContour() {
    var cw = contour.width, ch = contour.height;
    gc2.clearRect(0, 0, cw, ch);
    var th = Math.asin(Math.min(1, 1 / dEff));
    var R = Math.tan(th) / Math.tan(15 * Math.PI / 180) * ch / 2;
    var cx = cw / 2, cy = ch / 2, n = 240, i, a, r;
    // ombre : disque du globe, flou et décalé vers le bas ; seul ce qui dépasse de la sphère se voit
    go.clearRect(0, 0, cw, ch);
    go.save();
    go.shadowColor = 'rgba(0, 0, 0, 0.32)';
    go.shadowBlur = 18 * dpr;
    go.shadowOffsetY = 10 * dpr;
    go.fillStyle = '#ffffff';
    go.beginPath(); go.arc(cx, cy, R * 0.995, 0, 2 * Math.PI); go.fill();
    go.restore();

    gc2.lineJoin = 'round'; gc2.lineCap = 'round'; gc2.strokeStyle = CONTOUR;
    [[2.4, 0.95, 0], [1.1, 0.6, 1]].forEach(function (ps) {
      gc2.lineWidth = ps[0] * dpr; gc2.globalAlpha = ps[1];
      gc2.beginPath();
      for (i = 0; i <= n; i++) {
        a = i / n * 2 * Math.PI;
        r = R + (0.6 + rayonTremble(a, ps[2]) * (ps[2] ? 1.3 : 0.8)) * dpr;
        if (i) gc2.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
        else gc2.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
      }
      gc2.stroke();
    });
    gc2.globalAlpha = 1;
  }

  // Hauteur automatique de l'iframe : même message que les autres cartes de Vert ({ type: "vert-carte-hauteur", h })
  if (window.parent !== window) {
    var hEnvoyee = 0;
    var envoyerHauteur = function () {
      var h = Math.ceil(root.getBoundingClientRect().bottom + window.scrollY) + 2;
      if (h && h !== hEnvoyee) { hEnvoyee = h; window.parent.postMessage({ type: 'vert-carte-hauteur', h: h }, '*'); }
    };
    if (window.ResizeObserver) new ResizeObserver(envoyerHauteur).observe(root);
    addEventListener('load', envoyerHauteur);
    envoyerHauteur();
  }

  toggle();
})();
</script>
</body>
</html>
