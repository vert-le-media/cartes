     alt="Infographie : comment les PFAS finissent dans les eaux usées de l'usine. 1. L'eau arrive à l'usine. 2. En sortie, exempte de PFAS mais chargée d'autres polluants, elle part vers une station d'épuration. 3. La station, gorgée de PFAS, rejette une eau chargée (de 0 à environ 10 g de PFAS par litre) et une boue polluée épandue comme engrais. 4. L'eau est stockée dans deux bassins dont les sédiments sont fortement chargés en PFAS, puis rejetée dans la Bouzanne l'hiver.">
