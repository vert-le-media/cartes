<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coupes rases par commune | Vert</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Vend Sans, police du site vert.eco (comme la carte des data centers) ; chargée sans bloquer l'affichage -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vend+Sans:ital,wght@0,300..700;1,300..700&display=swap"
      media="print" onload="this.media='all'">
<link rel="stylesheet" href="carte.css">
<!-- Carte interactive des coupes rases 2019-2025. Données : donnees/*.js, produites par
     06_scripts/06_donnees_carte_interactive.R. S'ouvre par double-clic (aucun serveur nécessaire).
     Habillage repris de la carte des data centers (99_Archives/2026-10_data-centers) : cadre blanc, titre,
     légende au-dessus de la carte, recherche, carte, sources + logo, méthodologie repliée. -->
</head>
<body>
<div class="habillage">

  <h3 class="hab-titre">Les coupes rases en France entre 2019 et 2025</h3>

  <!-- légende au-dessus de la carte : titre et classes du mode affiché (version « part du territoire » retirée le 2026-11-23 : part de la forêt seulement) -->
  <div class="legende" id="legende">
    <div class="leg-titre" id="leg-titre"></div>
    <div class="leg-cases" id="leg-cases"></div>
  </div>

  <div class="recherche">
    <input id="q" type="search" placeholder="Cherchez votre commune" autocomplete="off"
           aria-label="Cherchez votre commune" role="combobox" aria-expanded="false" aria-controls="res">
    <button id="effacer" type="button" class="effacer" aria-label="Effacer la recherche" hidden>×</button>
    <div class="resultats" id="res" role="listbox" hidden></div>
  </div>

  <div class="cadre" id="cadre">
    <canvas id="carte" aria-label="Carte des coupes rases par commune, France métropolitaine, 2019-2025"></canvas>
    <div class="zoom">
      <button id="z-plus" type="button" title="Zoomer" aria-label="Zoomer">+</button>
      <button id="z-moins" type="button" title="Dézoomer" aria-label="Dézoomer">−</button>
      <button id="z-reset" type="button" title="Vue d'ensemble" aria-label="Vue d'ensemble">⤢</button>
    </div>
    <div class="tooltip" id="tt" hidden></div>
    <div class="chargement" id="chg">Chargement…</div>
  </div>

  <footer class="hab-pied">
    <span class="hab-source">Sources&nbsp;: Canopée&nbsp;; IGN · Infographie Sébastien Eid/Vert</span>
    <img class="hab-logo" src="logo-vert.png" alt="Vert">
  </footer>

  <details class="hab-methodo">
    <summary>Méthodologie</summary>
    <div class="hab-methodo-corps">
      <!-- à rédiger par Sébastien -->
    </div>
  </details>

</div>

<script>window.T_PAGE = performance.now();</script>
<script src="donnees/hex.js"></script>
<script src="donnees/contours.js"></script>
<script src="donnees/zones.js"></script>
<script src="donnees/mobilisations.js"></script>
<!-- VARIANTE COMMUNALE (test 2026-11-23) : taux par commune (script 10) et contours Etalab 100 m (script 11) -->
<script src="donnees/taux-communes.js"></script>
<script src="donnees/communes-carte.js"></script>
<!-- donnees/communes.js : chargé à la demande par carte.js (recherche, survol) -->
<script src="carte.js"></script>
</body>
</html>
